name: Test Suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Deny all permissions by default; each job grants only what it needs
permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Security audit (NuGet vulnerabilities)
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults --settings coverlet.runsettings

      - name: Generate coverage report
        uses: codecov/codecov-action@1f60566a86da84c4b4b64c17662a90de97fbb8d7 # v5.4.2
        with:
          files: ./backend/TestResults/**/coverage.cobertura.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-results
          path: ./backend/TestResults

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests with coverage
        run: npm run test:ci
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5255/api
          NEXT_PUBLIC_API_TIMEOUT: 30000

      - name: Generate coverage report
        uses: codecov/codecov-action@1f60566a86da84c4b4b64c17662a90de97fbb8d7 # v5.4.2
        with:
          files: ./coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: ./coverage

  e2e-tests:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Run E2E on pushes to the default branch (master) or when manually triggered.
    # PRs skip E2E (treated as OK by test-summary) to keep PR feedback fast; the
    # post-merge master push run is the gate. Verified green across chromium,
    # firefox and webkit via workflow_dispatch before enabling.
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      # Run all browsers even if one fails — provides full cross-browser picture
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Setup .NET for backend
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Build backend
        working-directory: ./backend
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

      - name: Start backend server
        working-directory: ./backend
        run: |
          dotnet run --project src/Accelerator.Api --no-build --configuration Release &
          # Wait for backend to be ready
          timeout 60 bash -c 'until curl -f http://localhost:5255/health; do sleep 2; done'
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5255

      - name: Build frontend
        run: npm run build
        env:
          # NEXT_PUBLIC_* vars are baked into client bundles at build time.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5255/api
          NEXT_PUBLIC_API_TIMEOUT: 30000
          # Auth.js v5 calls auth() in server components — next build fails without this.
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-for-e2e' }}
          AUTH_TRUST_HOST: true

      - name: Start frontend server
        run: |
          npm run start &
          # Wait for the Next.js server to be ready before running tests
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5255/api
          # Deterministic auth config for E2E. Real secrets are used when configured
          # (e.g. a downstream deployment); otherwise these non-sensitive fallbacks let
          # the synthetic-session suite run with no repo secrets. AUTH_SECRET must match
          # the value used by the "Run E2E tests" step so global.setup.ts's injected
          # session cookie validates. A non-empty AUTH_ENTRA_ISSUER is required: without
          # it Auth.js config validation fails and auth() returns a 500 body instead of
          # null, which breaks the unauthenticated "redirect to /login" guards.
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-for-e2e' }}
          AUTH_ENTRA_ISSUER: ${{ secrets.AUTH_ENTRA_ISSUER || 'https://login.microsoftonline.com/common/v2.0' }}
          AUTH_ENTRA_CLIENT_ID: ${{ secrets.AUTH_ENTRA_CLIENT_ID }}
          AUTH_ENTRA_CLIENT_SECRET: ${{ secrets.AUTH_ENTRA_CLIENT_SECRET }}
          AUTH_API_SCOPE_READ: ${{ secrets.AUTH_API_SCOPE_READ }}
          AUTH_API_SCOPE_WRITE: ${{ secrets.AUTH_API_SCOPE_WRITE }}
          AUTH_TRUST_HOST: true

      - name: Run E2E tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5255/api
          # Must match the "Start frontend server" step's AUTH_SECRET so the session
          # cookie that global.setup.ts injects (signed here) validates against the
          # running server. Falls back to a non-secret value when no repo secret exists.
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-for-e2e' }}
          AUTH_ENTRA_ISSUER: ${{ secrets.AUTH_ENTRA_ISSUER || 'https://login.microsoftonline.com/common/v2.0' }}
          AUTH_ENTRA_CLIENT_ID: ${{ secrets.AUTH_ENTRA_CLIENT_ID }}
          AUTH_ENTRA_CLIENT_SECRET: ${{ secrets.AUTH_ENTRA_CLIENT_SECRET }}
          AUTH_API_SCOPE_READ: ${{ secrets.AUTH_API_SCOPE_READ }}
          AUTH_API_SCOPE_WRITE: ${{ secrets.AUTH_API_SCOPE_WRITE }}
          AUTH_TRUST_HOST: true
          # E2E_API_WRITES=true enables create/edit/delete API tests (requires real Entra token)
          # E2E_API_WRITES: true

      - name: Upload Playwright report (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload login diagnostic screenshots (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: login-diagnostic-screenshots-${{ matrix.browser }}
          path: e2e/.auth/*.png
          if-no-files-found: ignore
          retention-days: 7

  validate-infrastructure:
    name: Validate Bicep Templates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Azure CLI + Bicep
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az bicep install

      - name: Validate Bicep templates
        run: az bicep build --file infrastructure/main.bicep

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, validate-infrastructure, e2e-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          FAILED=false

          if [[ "${{ needs.backend-tests.result }}" == "failure" ]]; then
            echo "backend-tests: FAILED"
            FAILED=true
          fi

          if [[ "${{ needs.frontend-tests.result }}" == "failure" ]]; then
            echo "frontend-tests: FAILED"
            FAILED=true
          fi

          if [[ "${{ needs.validate-infrastructure.result }}" == "failure" ]]; then
            echo "validate-infrastructure: FAILED"
            FAILED=true
          fi

          # E2E: only fail if it ran AND failed (skipped = OK on PRs)
          if [[ "${{ needs.e2e-tests.result }}" == "failure" ]]; then
            echo "e2e-tests: FAILED"
            FAILED=true
          elif [[ "${{ needs.e2e-tests.result }}" == "skipped" ]]; then
            echo "e2e-tests: SKIPPED (PR — runs on master push / dispatch)"
          fi

          if [ "$FAILED" = true ]; then
            echo "One or more test suites failed"
            exit 1
          else
            echo "All test suites passed"
          fi
