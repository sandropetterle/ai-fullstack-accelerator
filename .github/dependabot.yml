version: 2
updates:
  # Frontend npm (root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      testing:
        patterns:
          - "jest"
          - "jest-environment-jsdom"
          - "@types/jest"
          - "@testing-library/*"
          - "jest-axe"
          - "@types/jest-axe"
          - "@playwright/test"
      types:
        patterns:
          - "@types/node"
          - "@types/react"
          - "@types/react-dom"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # tailwindcss v4 is a breaking rewrite — defer to Phase 8
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # eslint v10 has breaking plugin changes — defer to Phase 8
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # next-auth v5 is intentionally on beta — don't auto-bump to v4 stable
      - dependency-name: "next-auth"
        update-types: ["version-update:semver-major"]
      # typescript-eslint's peer range (>=4.8.4 <6.1.0 as of typescript-eslint 8.70.1)
      # does not yet support TypeScript 7. Defer until typescript-eslint adds support.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # Runtime is Node 24 LTS (engines >=24.15); hold @types/node at 25.x rather than
      # letting it drift further ahead of the runtime
      - dependency-name: "@types/node"
        versions: [">=26.0.0"]

  # NOTE: no npm ecosystem entry for /cms — cms/ has no package.json in this
  # repo (Strapi is an optional, bring-your-own integration; see README).
  # Add one back once you scaffold the Strapi app into cms/.

  # .NET NuGet (backend/)
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      dotnet-servicing:
        patterns:
          - "Microsoft.*"
        exclude-patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.NET.Test.Sdk"
      ef-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
      test-infrastructure:
        patterns:
          - "xunit*"
          - "FluentAssertions"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "Moq"
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "coverlet.*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker — frontend
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # We adopt new Node LTS majors deliberately (see decision log)
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Docker — backend
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  # Docker — CMS
  - package-ecosystem: "docker"
    directory: "/cms"
    schedule:
      interval: "monthly"
    ignore:
      # We adopt new Node LTS majors deliberately (see decision log)
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
